name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client lint, tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mavuus-app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mavuus-app/client/package-lock.json
      - run: npm ci
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npx vite build
      - run: npm run guard
      - run: npm run build-storybook

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mavuus-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mavuus-app/server/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mavuus-app/client/package-lock.json
            mavuus-app/server/package-lock.json
      - run: npm ci
        working-directory: mavuus-app/server
      - run: npm ci
        working-directory: mavuus-app/client
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: mavuus-app/client
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: mavuus-app/client
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: mavuus-app/client
      - run: npm run e2e
        working-directory: mavuus-app/client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            mavuus-app/client/e2e/screenshots/
            mavuus-app/client/playwright-report/
            mavuus-app/client/test-results/
          retention-days: 7
