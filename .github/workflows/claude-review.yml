name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.CLAUDE_TOKEN != ''
        with:
          fetch-depth: 1
      # Skips quietly until the CLAUDE_CODE_OAUTH_TOKEN secret exists (run `claude setup-token`).
      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for real bugs, security problems, and broken behavior.
            Read CLAUDE.md for the project's rules. Skip style nits the linter already covers.
            Use `gh pr comment` for one short summary, and inline comments for specific lines.
            If nothing is wrong, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
